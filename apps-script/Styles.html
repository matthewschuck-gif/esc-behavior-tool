<style>
:root{--purple:#5B21B6;--purple-light:#EDE9FE;--purple-mid:#7C3AED;--purple-dark:#3B0764;--gold:#F59E0B;--gold-light:#FEF3C7;--gold-dark:#B45309;--green-light:#DCFCE7;--green-mid:#16A34A;--green-dark:#14532D;--blue-light:#DBEAFE;--blue-mid:#1D4ED8;--blue-dark:#1E3A8A;--red-light:#FEE2E2;--red-mid:#DC2626;--teal-light:#CCFBF1;--teal-mid:#0D9488;--gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;--gray-400:#9CA3AF;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#F8F7FF;color:var(--gray-800);min-height:100vh}
.header{background:linear-gradient(135deg,var(--purple-dark) 0%,var(--purple) 60%,#4C1D95 100%);color:white;padding:1.5rem 1rem 1.25rem;text-align:center}
.header-badge{display:inline-block;background:var(--gold);color:var(--purple-dark);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.header h1{font-size:26px;font-weight:800;margin-bottom:4px}
.header h1 span{color:var(--gold)}
.header-sub{font-size:13px;opacity:.85;margin-bottom:12px}
.header-scientist{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.04em;margin-bottom:14px;text-transform:uppercase}
.header-links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hlink{display:inline-flex;align-items:center;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;text-decoration:none;transition:all .15s}
.hlink:hover{background:rgba(255,255,255,.25);color:var(--gold)}
.hlink.gold{background:var(--gold);border-color:var(--gold);color:var(--purple-dark)}
.hlink.gold:hover{background:#FBBF24}
.nav-tabs{background:var(--purple-dark);display:flex;justify-content:center;border-bottom:3px solid var(--gold);flex-wrap:wrap}
.nav-tab{padding:10px 14px;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);cursor:pointer;border:none;background:transparent;transition:all .15s;border-bottom:3px solid transparent;margin-bottom:-3px}
.nav-tab:hover{color:white;background:rgba(255,255,255,.08)}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(245,158,11,.1)}
.nbadge{background:var(--red-mid);color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;margin-left:4px;vertical-align:middle}
.page{display:none}
.page.active{display:block}
.main{max-width:760px;margin:0 auto;padding:1.5rem 1rem 4rem}
.hero{background:linear-gradient(135deg,var(--purple-dark),var(--purple));color:white;border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;border-bottom:4px solid var(--gold)}
.hero h2{font-size:20px;font-weight:800;margin-bottom:6px}
.hero p{font-size:13px;opacity:.85;line-height:1.6}
.rule-bar{background:white;border-bottom:1px solid var(--gray-200);padding:8px 1rem;display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center}
.rule{font-size:12px;color:var(--gray-500)}
.rule strong{color:var(--gray-700)}
.progress-wrap{background:white;border-bottom:1px solid var(--gray-200);padding:10px 1rem;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.step-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;justify-content:center}
.step{display:flex;align-items:center;gap:4px;font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--gray-300);color:var(--gray-500);background:white;font-weight:500}
.step.active{background:var(--purple-light);color:var(--purple);border-color:var(--purple)}
.step.done{background:var(--green-light);color:var(--green-mid);border-color:var(--green-mid)}
.step-num{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.pbar-track{height:4px;background:var(--gray-200);border-radius:2px}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));border-radius:2px;transition:width .4s ease}
.pbar-label{text-align:center;font-size:11px;color:var(--gray-500);margin-top:3px}
.card{background:white;border:1px solid var(--gray-200);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--gray-100)}
.sec-badge{font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;flex-shrink:0;white-space:nowrap}
.card-title{font-size:16px;font-weight:700;color:var(--gray-800)}
.card-focus{font-size:12px;color:var(--gray-500);margin-top:3px;line-height:1.5}
.q{margin-bottom:1.25rem}
.q label{display:block;font-size:14px;font-weight:600;color:var(--gray-700);margin-bottom:5px}
.hint{font-size:12px;color:var(--gray-500);margin-bottom:7px;font-style:italic;line-height:1.5}
textarea,input[type=text],select{width:100%;font-family:inherit;font-size:14px;color:var(--gray-800);background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:8px;padding:9px 12px;resize:vertical;transition:border-color .15s}
textarea{min-height:80px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(91,33,182,.1)}
.chip-group{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--gray-200);font-size:13px;cursor:pointer;background:var(--gray-50);color:var(--gray-600);transition:all .15s;user-select:none;font-weight:500}
.chip:hover{border-color:var(--purple);color:var(--purple)}
.chip.sel{background:var(--purple-light);color:var(--purple);border-color:var(--purple);font-weight:600}
.obs-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:260px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px;padding:8px;background:var(--gray-50)}
.obs-chip{padding:5px 10px;border-radius:6px;border:1px solid var(--gray-200);font-size:12px;cursor:pointer;background:white;color:var(--gray-600);transition:all .15s;user-select:none;line-height:1.4}
.obs-chip:hover{border-color:var(--purple);color:var(--purple)}
.obs-chip.sel{background:var(--purple-light);color:var(--purple);border-color:var(--purple);font-weight:600}
.emotion-signal{border-radius:10px;padding:10px 14px;margin-top:10px;display:none;font-size:13px;line-height:1.6}
.emotion-signal-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.bucket-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bucket-card{border:2px solid var(--gray-200);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;background:white}
.bucket-card:hover{border-color:var(--gray-300);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bucket-title{font-size:14px;font-weight:700;margin-bottom:4px}
.bucket-desc{font-size:12px;color:var(--gray-500);line-height:1.5}
.insight-box{background:var(--blue-light);border-left:4px solid var(--blue-mid);border-radius:0 8px 8px 0;padding:12px 14px;margin-top:1rem;display:none}
.insight-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-mid);margin-bottom:5px}
.insight-text{font-size:13px;color:var(--gray-700);line-height:1.65}
.btn-row{display:flex;gap:10px;align-items:center;margin-top:1.5rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;border:2px solid var(--gray-200);background:white;color:var(--gray-700)}
.btn:hover{background:var(--gray-50)}
.btn-primary{background:var(--purple);color:white;border-color:var(--purple)}
.btn-primary:hover{background:var(--purple-mid)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--purple-dark);border-color:var(--gold);font-weight:700}
.btn-gold:hover{background:#FBBF24}
.btn-teal{background:var(--teal-mid);color:white;border-color:var(--teal-mid)}
.btn-teal:hover{background:#0F766E}
.btn-outline{background:white;color:var(--purple);border-color:var(--purple)}
.btn-outline:hover{background:var(--purple-light)}
.btn-sm{padding:6px 12px;font-size:12px}
.dots{display:inline-flex;gap:3px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:bop 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bop{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.hidden{display:none!important}
#results{display:none}
.r-header{background:linear-gradient(135deg,var(--purple-dark) 0%,var(--purple) 100%);color:white;border-radius:16px;padding:1.5rem;margin-bottom:1.25rem;border-bottom:4px solid var(--gold)}
.r-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.75;margin-bottom:8px}
.r-title{font-size:22px;font-weight:800;margin-bottom:6px}
.r-meta{font-size:12px;opacity:.7;margin-bottom:10px}
.tags{margin-bottom:10px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-right:5px;margin-bottom:5px}
.tag-high{background:#FEE2E2;color:#991B1B}
.tag-moderate{background:var(--gold-light);color:#92400E}
.tag-low{background:var(--green-light);color:var(--green-dark)}
.tag-info{background:rgba(255,255,255,.2);color:white;border:1px solid rgba(255,255,255,.3)}
.r-summary{font-size:14px;opacity:.9;line-height:1.7}
.trauma-banner{background:#FEF3C7;border:1.5px solid var(--gold);border-radius:10px;padding:12px 14px;margin-bottom:1rem}
.trauma-banner-title{font-size:12px;font-weight:700;color:#92400E;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.trauma-banner-body{font-size:13px;color:#78350F;line-height:1.6}
.window-banner{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:10px;padding:12px 14px;margin-bottom:1.25rem}
.window-banner-title{font-size:11px;font-weight:700;color:var(--purple);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.window-banner-body{font-size:13px;color:var(--purple-dark);line-height:1.6}
.bucket-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem}
.bucket-pill{padding:12px;border-radius:10px}
.bucket-pill-title{font-size:13px;font-weight:700;margin-bottom:3px}
.bucket-pill-body{font-size:12px;opacity:.85;line-height:1.5}
.rcard{background:white;border:1px solid var(--gray-200);border-radius:14px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rcard-title{font-size:14px;font-weight:700;color:var(--gray-800);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--gray-100)}
.rcard-body{font-size:13px;color:var(--gray-600);line-height:1.7}
.int-item{padding:12px 0;border-bottom:1px solid var(--gray-100)}
.int-item:last-child{border-bottom:none}
.int-name{font-size:14px;font-weight:700;color:var(--gray-800);margin-bottom:4px}
.int-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.int-bucket-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px}
.int-link{font-size:12px;color:var(--blue-mid);text-decoration:none;font-weight:600}
.int-link:hover{text-decoration:underline}
.int-why{font-size:13px;color:var(--gray-600);margin-bottom:5px;line-height:1.5}
.int-moves{font-size:12px;color:var(--gray-600);line-height:1.6;background:var(--gray-50);border-radius:6px;padding:8px 10px;border-left:3px solid var(--purple)}
.int-moves strong{color:var(--purple)}
.warning-card{background:#FEF2F2;border:1.5px solid #FCA5A5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.warning-card-title{font-size:13px;font-weight:700;color:var(--red-mid);margin-bottom:6px}
.warning-card-body{font-size:13px;color:#7F1D1D;line-height:1.6}
.trial-card{background:linear-gradient(135deg,#F0FDF4,#DCFCE7);border:1.5px solid #86EFAC;border-radius:14px;padding:1.25rem;margin-bottom:1rem}
.trial-title{font-size:14px;font-weight:700;color:var(--green-dark);margin-bottom:8px}
.trial-body{font-size:13px;color:#166534;line-height:1.7}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
.review-card{background:var(--blue-light);border:1.5px solid #93C5FD;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.review-title{font-size:13px;font-weight:700;color:var(--blue-mid);margin-bottom:5px}
.review-body{font-size:13px;color:var(--blue-dark);line-height:1.6}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--gray-200)}
.error-card{background:#FEF2F2;border:1.5px solid #FCA5A5;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.error-card p{font-size:14px;line-height:1.6}
.error-card p:first-child{font-weight:700;color:#991B1B;margin-bottom:4px}
.error-card p:last-child{color:#7F1D1D}
.teacher-info{background:var(--gold-light);border:1.5px solid var(--gold);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.teacher-info-title{font-size:13px;font-weight:700;color:var(--gold-dark);margin-bottom:10px}
.teacher-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.teacher-info input{background:white}
.bucket-section{margin-bottom:2rem}
.bucket-section-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:8px;border-bottom:2px solid var(--gray-200)}
.bucket-section-title{font-size:17px;font-weight:700}
.bucket-section-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lib-card{background:white;border:1px solid var(--gray-200);border-radius:12px;padding:1rem;text-decoration:none;color:inherit;transition:all .15s;display:block;border-left:4px solid var(--gray-200)}
.lib-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-1px)}
.admin-card{cursor:default}
.admin-card:hover{transform:none;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.lib-card-name{font-size:13px;font-weight:700;color:var(--gray-800);margin-bottom:4px}
.lib-card-desc{font-size:12px;color:var(--gray-500);line-height:1.5}
.lib-card-link{font-size:11px;font-weight:600;margin-top:6px;display:inline-block}
.lib-search{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:1.5rem;background:white}
.lib-search:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(91,33,182,.1)}
.res-section{margin-bottom:2rem}
.res-section h3{font-size:16px;font-weight:700;color:var(--gray-800);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.res-card{background:white;border:1px solid var(--gray-200);border-radius:12px;padding:1rem;text-decoration:none;color:inherit;transition:all .15s;display:block}
.res-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);border-color:var(--purple)}
.res-card-title{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:4px}
.res-card-desc{font-size:12px;color:var(--gray-500);line-height:1.5}
.emotion-section{margin-bottom:2rem}
.emotion-section-title{font-size:17px;font-weight:700;color:var(--gray-800);margin-bottom:4px}
.emotion-section-sub{font-size:13px;color:var(--gray-500);margin-bottom:1rem;line-height:1.5}
.mood-meter-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
.mood-zone{border-radius:14px;padding:1.25rem;border:1.5px solid transparent}
.mood-zone-title{font-size:16px;font-weight:800;margin-bottom:4px}
.mood-zone-sub{font-size:12px;font-weight:600;opacity:.8;margin-bottom:8px}
.mood-zone-desc{font-size:12px;line-height:1.6;margin-bottom:8px}
.mood-zone-strategies{font-size:12px;font-weight:600;margin-bottom:4px}
.mood-zone-list{font-size:12px;line-height:1.7;opacity:.9}
.emotion-framework{background:white;border:1px solid var(--gray-200);border-radius:14px;padding:1.25rem;margin-bottom:1rem}
.emotion-framework-title{font-size:14px;font-weight:700;color:var(--gray-800);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--gray-100)}
.ef-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ef-card{border-radius:10px;padding:10px}
.ef-card-title{font-size:12px;font-weight:700;margin-bottom:6px}
.ef-item{font-size:12px;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.06);line-height:1.5}
.ef-item:last-child{border:none}
.domains-grid{display:grid;grid-template-columns:1fr;gap:8px}
.domain-card{background:white;border:1px solid var(--gray-200);border-radius:10px;padding:1rem;display:flex;gap:12px;align-items:flex-start}

.domain-name{font-size:13px;font-weight:700;color:var(--gray-800);margin-bottom:3px}
.domain-desc{font-size:12px;color:var(--gray-500);line-height:1.5}
.praise-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem}
.praise-card{border-radius:12px;padding:1rem;text-align:center}
.praise-type{font-size:14px;font-weight:800;margin-bottom:4px}
.praise-example{font-size:12px;font-style:italic;margin-bottom:6px;opacity:.8}
.praise-rec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:6px}
.praise-why{font-size:12px;opacity:.85;line-height:1.5}

.gf-steps{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gf-step{background:var(--purple);color:white;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;text-align:center}
.gf-plus{font-size:16px;font-weight:700;color:var(--purple)}
.regulation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.reg-card{background:white;border:1px solid var(--gray-200);border-radius:12px;padding:1rem;border-top:4px solid var(--gray-200)}
.reg-card-title{font-size:13px;font-weight:700;color:var(--gray-800);margin-bottom:4px}
.reg-card-desc{font-size:12px;color:var(--gray-500);margin-bottom:6px;line-height:1.5}
.reg-strategies{font-size:12px;color:var(--gray-600);line-height:1.7}
.coregulation-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.coreg-card{border-radius:12px;padding:1rem;border:1px solid transparent}
.coreg-title{font-size:14px;font-weight:700;margin-bottom:6px}
.coreg-desc{font-size:12px;line-height:1.5;margin-bottom:8px;opacity:.85}
.coreg-list{font-size:12px;line-height:1.8;opacity:.9}
.emotion-link-card{background:white;border:1px solid var(--gray-200);border-radius:12px;padding:1rem;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:inherit;transition:all .15s}
.emotion-link-card:hover{border-color:var(--purple);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.emotion-link-name{font-size:13px;font-weight:700;color:var(--gray-800)}
.emotion-link-desc{font-size:12px;color:var(--gray-500);margin-top:2px}
.log-empty{text-align:center;padding:3rem 1rem;color:var(--gray-400)}
.log-empty-icon{font-size:48px;margin-bottom:12px}
.log-empty-title{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--gray-500)}

/* DARK MODE TOGGLE */
.dark-toggle{position:absolute;right:1rem;top:1rem;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}

.header-inner{position:relative}

/* STRATEGY OF THE DAY */
.sotd-card{background:white;border:1px solid var(--gray-200);border-radius:14px;padding:1.25rem;margin-bottom:1.5rem;border-left:4px solid var(--purple)}
.sotd-eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--purple);margin-bottom:6px}
.sotd-name{font-size:16px;font-weight:700;color:var(--gray-800);margin-bottom:4px}

.sotd-desc{font-size:13px;color:var(--gray-600);line-height:1.6;margin-bottom:10px}

/* GLOSSARY TOOLTIPS */
.gterm{border-bottom:1px dashed var(--purple);cursor:help;color:inherit;position:relative;display:inline}
.gterm:hover .gtooltip{display:block}
.gtooltip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:white;color:var(--gray-800);font-size:12px;line-height:1.6;padding:10px 14px;border-radius:10px;width:260px;z-index:999;font-weight:400;box-shadow:0 4px 20px rgba(0,0,0,.18);border:1px solid var(--gray-200);pointer-events:none}
.gtooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:white}
.gtooltip::before{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--gray-200);margin-top:1px}

/* PASSWORD GATE */
.pw-gate{position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(88,28,135,0.45) 0%,transparent 70%),#080612;display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem}

.pw-input{width:100%;padding:12px 16px;font-size:16px;font-family:inherit;border:1.5px solid rgba(168,85,247,0.3);border-radius:10px;text-align:center;letter-spacing:.15em;margin-bottom:12px;transition:border-color .15s;background:#0a0618;color:#e9e4ff}

/* QUICK SEARCH FAB */
.quick-search-fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--purple);color:white;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(91,33,182,.4);z-index:400;transition:all .2s;display:flex;align-items:center;justify-content:center}

<style>
/* ── Craft: an ode to Pixar's craft, not its characters ───────────────────────────────────
   No characters, logos or famous shots. What's borrowed is how their films move and are lit:
   - squash and stretch, anticipation, follow-through and overshoot (the animation principles)
   - a warm key light, a cool rim light and dust floating in the light (cinematic lighting)
   - arcs: things that fly travel on curves, not straight lines
   Each tool keeps its own colors through --craft-accent / --craft-accent-2. Staff tools set
   <html data-craft="calm">, which keeps the same moves smaller and quicker (they're used all day).
   Everything here is off for people who ask for less motion. */
:root {
  --craft-accent: #9b5de5; --craft-accent-2: #ffe100;
  --craft-out: cubic-bezier(.22, 1, .36, 1);
  --craft-spring: cubic-bezier(.34, 1.56, .64, 1);
  --craft-squash: 1.06 .9; --craft-press-ms: .5s;
  --craft-key: rgba(255, 218, 160, .22); --craft-rim: rgba(140, 186, 255, .32);
}
@supports (transition-timing-function: linear(0, 1)) {
  /* A real spring: overshoots, comes back past rest, settles. */
  :root { --craft-spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
}
html[data-craft="calm"] { --craft-squash: 1.02 .96; --craft-press-ms: .35s; }

/* Squash on press, spring back on release (buttons that do something). Craft uses the separate
   `scale` property, so it stacks with an element's own transform (centering, hover lifts). */
.craft-press { transition: scale var(--craft-press-ms) var(--craft-spring); }
.craft-press:active:not(:disabled) { scale: var(--craft-squash); transition: scale .07s ease-out; }

/* A success moment: anticipation (a tiny crouch), stretch up, squash, settle. */
.craft-pop { animation: craftPop .7s var(--craft-out) both; }
@keyframes craftPop {
  0% { scale: .7; opacity: 0; }
  30% { scale: 1.12 .88; opacity: 1; }
  50% { scale: .94 1.08; }
  70% { scale: 1.03 .98; }
  100% { scale: 1; }
}
html[data-craft="calm"] .craft-pop { animation-name: craftPopCalm; animation-duration: .45s; }
@keyframes craftPopCalm { 0% { scale: .94; opacity: 0; } 60% { scale: 1.02; opacity: 1; } 100% { scale: 1; } }

/* A number that just finished counting lands with a little bump. */
.craft-land { display: inline-block; animation: craftLand .5s var(--craft-out); }
@keyframes craftLand { 0% { scale: 1; } 35% { scale: 1.14 .9; } 65% { scale: .97 1.04; } 100% { scale: 1; } }

/* Cinematic light on a hero card: warm key light from the top left, cool rim along the bottom edge. */
.craft-lit { position: relative; isolation: isolate; }
.craft-lit::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: radial-gradient(80% 90% at 8% 0%, var(--craft-key), transparent 60%);
  box-shadow: inset 0 1px 0 rgba(255, 240, 215, .28), inset 0 -26px 46px -34px var(--craft-rim); }

/* Dust floating in the light. Slow, few, faint; on hero cards only. */
.craft-motes { position: relative; isolation: isolate; overflow: hidden; }
.craft-motes::after { content: ''; position: absolute; inset: -40% -15%; pointer-events: none; z-index: -1; opacity: .55;
  background-image:
    radial-gradient(2px 2px at 12% 28%, rgba(255, 236, 190, .9), transparent 70%), radial-gradient(1.5px 1.5px at 31% 66%, rgba(255, 236, 190, .7), transparent 70%),
    radial-gradient(2.5px 2.5px at 47% 18%, rgba(255, 236, 190, .6), transparent 70%), radial-gradient(1.5px 1.5px at 63% 52%, rgba(255, 236, 190, .8), transparent 70%),
    radial-gradient(2px 2px at 78% 34%, rgba(255, 236, 190, .7), transparent 70%), radial-gradient(1px 1px at 88% 74%, rgba(255, 236, 190, .9), transparent 70%),
    linear-gradient(112deg, transparent 32%, rgba(255, 222, 160, .07) 44%, transparent 58%);
  background-size: 420px 300px, 420px 300px, 420px 300px, 420px 300px, 420px 300px, 420px 300px, 100% 100%;
  animation: craftMotes 18s linear infinite alternate; }
@keyframes craftMotes { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-36px, -70px, 0); } }

/* Celebration bits (craftCelebrate): flown on arcs by the script, then cleaned up. */
.craft-bit { position: fixed; left: 0; top: 0; width: 10px; height: 14px; border-radius: 3px; pointer-events: none; z-index: 2147483000; will-change: transform, opacity; }
.craft-bit.round { border-radius: 50%; width: 10px; height: 10px; }

/* Keyboard focus that's always visible. */
.craft-focus:focus-visible { outline: 2px solid var(--craft-accent-2); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .craft-press, .craft-press:active { transition: none !important; scale: none !important; }
  .craft-pop, .craft-land, .craft-motes::after { animation: none !important; }
}
</style>
<script>
/* Craft helpers. craftPop(el): play the success pop again. craftLand(el): bump a number.
   craftCelebrate(el, colors): a short burst of bits flying on arcs from el (a vote counted,
   a reward earned). All three do nothing for people who ask for less motion. */
(function () {
  var reduce = function () { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; };
  var replay = function (el, cls) { if (!el || reduce()) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  window.craftPop = function (el) { replay(el, 'craft-pop'); };
  window.craftLand = function (el) { replay(el, 'craft-land'); };
  window.craftCelebrate = function (el, colors) {
    if (!el || reduce() || !el.getBoundingClientRect || !document.body.animate) return;
    var calm = document.documentElement.getAttribute('data-craft') === 'calm';
    var r = el.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    var css = getComputedStyle(document.documentElement);
    var pal = colors && colors.length ? colors : [css.getPropertyValue('--craft-accent').trim() || '#9b5de5', css.getPropertyValue('--craft-accent-2').trim() || '#ffe100', '#ffffff'];
    var n = calm ? 10 : 22;
    for (var i = 0; i < n; i++) {
      var b = document.createElement('span');
      b.className = 'craft-bit' + (i % 3 === 0 ? ' round' : '');
      b.style.background = pal[i % pal.length];
      document.body.appendChild(b);
      // An arc: up and out, then gravity pulls it down (slow in, slow out at the top).
      var ang = (-90 + (Math.random() - .5) * 150) * Math.PI / 180, v = (calm ? 90 : 150) + Math.random() * (calm ? 60 : 120);
      var dx = Math.cos(ang) * v, dy = Math.sin(ang) * v, fall = 160 + Math.random() * 140, spin = (Math.random() - .5) * 720;
      var frames = [], steps = 12;
      for (var s = 0; s <= steps; s++) {
        var t = s / steps, x = x0 + dx * t * 1.4, y = y0 + dy * t * 1.4 + fall * t * t;
        frames.push({ transform: 'translate(' + x + 'px,' + y + 'px) rotate(' + spin * t + 'deg) scale(' + (t < .15 ? .6 + t * 2.6 : 1) + ')', opacity: t > .75 ? (1 - t) * 4 : 1 });
      }
      b.animate(frames, { duration: (calm ? 700 : 1000) + Math.random() * 400, easing: 'linear', fill: 'forwards' }).onfinish = (function (node) { return function () { node.remove(); }; })(b);
    }
  };
})();
</script>
