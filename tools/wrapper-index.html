<!DOCTYPE html>
<!-- behaviorinterventioncenter.com: shows the BIC Apps Script web app full-screen. Nothing is
     stored here. At the switch, this becomes the page the domain serves (see README). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behavior Intervention Center</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f0a1e; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="app" title="Behavior Intervention Center" allow="clipboard-write"></iframe>
<script>
  // The BIC web app's /exec link (Deploy › Manage deployments). Paste it at the switch.
  var APP = 'PASTE_THE_EXEC_LINK_HERE';
  // ?id=800# (from Climb-er or Follow-Up) passes straight through.
  document.getElementById('app').src = APP + location.search;
</script>
</body>
</html>
