<!DOCTYPE html>
<!-- behaviorinterventioncenter.com: shows the BIC Apps Script web app full-screen. Nothing is
     stored here; the app, its content and saved plans live in the BIC Google Sheet. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behavior Intervention Center</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f0a1e; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  /* If Google can't show the app inside this page (not signed in to the school account, or
     Chrome blocking Google's sign-in here), this opens it as its own page. */
  .open-full { position: fixed; top: 10px; left: 10px; z-index: 2; padding: 6px 12px; border-radius: 999px;
    background: rgba(59, 7, 100, .85); color: #fff; font: 600 12px/1.2 system-ui, sans-serif; text-decoration: none; opacity: .75; }
  .open-full:hover, .open-full:focus { opacity: 1; }
</style>
</head>
<body>
<iframe id="app" title="Behavior Intervention Center" allow="clipboard-write"></iframe>
<a class="open-full" id="openFull" target="_top">Page blank? Open it here ↗</a>
<script>
  // The BIC web app's /exec link (Deploy › Manage deployments).
  var APP = 'https://script.google.com/a/macros/easdpa.org/s/AKfycbxCXdf9Xf-bYlSP4NGjsFOT0GhWEqS4L9QTS40pg1BDOG6MJ3NUwHsXoXSITqFSIIDD/exec';
  // ?id=800# (from Climb-er or Follow-Up) passes straight through.
  document.getElementById('app').src = APP + location.search;
  document.getElementById('openFull').href = APP + location.search;
</script>
</body>
</html>
